{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center my-4">
    <div class="col-md-7 col-lg-6">
        <div class="card shadow-lg border-0 rounded-4">
            <div class="card-body p-4 p-md-5">
                <div class="text-center mb-4">
                    <div class="bg-success text-white rounded-circle d-inline-flex align-items-center justify-content-center mb-2 shadow-sm" style="width: 60px; height: 60px; font-size: 24px;">
                        <i class="bi bi-chat-heart-fill"></i>
                    </div>
                    <h2 class="fw-bold mb-1">Send Feedback</h2>
                    <p class="text-muted">We'd love to hear your thoughts or report issues</p>
                </div>

                <form method="post" novalidate>
                    {% csrf_token %}

                    {% for field in form %}
                        <div class="mb-3">
                            <label for="{{ field.id_for_label }}" class="form-label fw-semibold text-secondary small text-uppercase">{{ field.label }}</label>
                            {{ field }}
                            {% for error in field.errors %}
                                <div class="invalid-feedback d-block">{{ error }}</div>
                            {% endfor %}
                        </div>
                    {% endfor %}

                    <div class="d-grid mt-4">
                        <button type="submit" class="btn btn-success py-2 rounded-pill fw-semibold shadow-sm text-white">Submit Feedback</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
